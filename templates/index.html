<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Project Layout</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Header with logo -->
  <div class="header">
    <img src="/static/logo.png" alt="Logo" class="logo" />
    <p class="logo-title">Data Quality Tool</p>
  </div>

  <div class="container">

    <!-- Add New Record Button -->
    <div class="add-record">
      <button onclick="location.href='add-record.html'">Add New Record</button>
    </div>

    <!-- Block 1: Project Details -->
    <div class="block block1">
      <div class="block-header">
        <h3>Project Details</h3>
        <button class="view-btn">View Details</button>
      </div>
      <div class="field">
        <label for="projid">PROJID</label>
        <input type="text" id="projid" />
      </div>
      <div class="field">
        <label for="date">Date of Validation</label>
        <input type="date" id="date" />
      </div>
    </div>

    <!-- DS_Source Toggle -->
    <div class="ds-source-toggle">
      <button onclick="toggleDsSource()">DS_Source ▼</button>
    </div>

    <!-- DS_Source Blocks -->
    <div id="dsSourceSection" class="ds-source">
      <!-- Block 2: Source File Details -->
      <div class="block block2">
        <h3>Source File Details</h3>
        <div class="field"><label>SOURCEFILE</label><input type="text" /></div>
        <div class="field"><label>SOURCEDIR</label><input type="text" /></div>
        <div class="field"><label>NULLLOGFILE</label><input type="text" /></div>
        <div class="field"><label>DUPLICATELOGFILE</label><input type="text" /></div>
        <div class="field"><label>OUTPUTPATH</label><input type="text" /></div>
      </div>

      <!-- Block 3: Source Table Details -->
      <div class="block block3">
        <h3>Source Table Details</h3>
        <div class="field"><label>SOURCETABLE</label><input type="text" /></div>
        <div class="field"><label>SOURCECOLUMNS</label><input type="text" /></div>
        <div class="field"><label>PKCOL</label><input type="text" /></div>
      </div>
    </div>

    <!-- Block 4: Connection Details -->
    <div class="block block4">
      <h3>Connection Details</h3>
      <div class="field"><label>DBSCHEMA</label><input type="text" /></div>
      <div class="field"><label>DB_HOST</label><input type="text" /></div>
      <div class="field"><label>PORT</label><input type="text" /></div>
      <div class="field"><label>SERVICENAME</label><input type="text" /></div>
      <div class="field"><label>DBUSER</label><input type="text" /></div>
      <div class="field"><label>DBENCKEY</label><input type="text" /></div>
      <div class="field"><label>CHUNKSIZE</label><input type="text" /></div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
